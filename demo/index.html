<!doctype html>
<html lang="id">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Talita Widget Demo</title>
<style>
  body{margin:0;min-height:100vh;background:#F5F8FC;color:#0A1F33;font:15px/1.6 system-ui,sans-serif}
  main{max-width:760px;margin:0 auto;padding:48px 16px 120px}
  h1{font-size:28px;margin:0 0 6px}
  .tabs{display:flex;flex-wrap:wrap;gap:8px;margin:20px 0}
  .tabs button{padding:9px 15px;border-radius:999px;border:1px solid #D5E0EC;background:#fff;font:inherit;font-weight:700;cursor:pointer}
  .tabs button[aria-pressed="true"]{background:#0A2246;color:#fff;border-color:#0A2246}
  pre{background:#0A1F33;color:#CFE3FF;padding:14px;border-radius:12px;font-size:12px;overflow:auto;max-height:420px;white-space:pre-wrap;word-break:break-word}
  code{font-size:13px}
</style>
</head>
<body>
<main>
  <h1>Talita · demo widget</h1>
  <p>Klik tombol di kanan bawah. Pilih varian halaman untuk melihat tema dan isi rekomendasi yang berbeda. Payload yang dikirim widget tampil di log bawah dan dicatat server ke <code>mock-server/data/*.jsonl</code>.</p>
  <div class="tabs" id="tabs"></div>
  <h2 style="font-size:16px">Event log (onEvent / onLead)</h2>
  <pre id="log">—</pre>
</main>
<script src="../widget/talita.js"></script>
<script>
  var logEl = document.getElementById('log'), lines = [];
  function log(o) { lines.unshift(JSON.stringify(o, null, 2)); logEl.textContent = lines.slice(0, 30).join('\n\n'); }
  var start = new URLSearchParams(location.search).get('variant') || 'utama';
  Talita.init({
    apiBase: '/api/talita',
    siteKey: 'pk_test_demo',
    variant: start,
    onEvent: log,
    onLead: function (l) { log({ onLead: l }); }
  });
  var tabs = document.getElementById('tabs');
  Talita.variants.forEach(function (v) {
    var b = document.createElement('button');
    b.textContent = v; b.setAttribute('aria-pressed', String(v === start));
    b.onclick = function () {
      tabs.querySelectorAll('button').forEach(function (x) { x.setAttribute('aria-pressed', String(x === b)); });
      Talita.setVariant(v); Talita.open();
    };
    tabs.appendChild(b);
  });
</script>
</body>
</html>
